<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · SoloCRM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f4ff; }
    .auth-card { max-width: 420px; margin: 80px auto; }
    .brand { font-size: 1.5rem; font-weight: 800; color: #2563eb; }
  </style>
</head>
<body>
<div class="auth-card px-3">
  <div class="text-center mb-4">
    <div class="brand"><i class="bi bi-diagram-3-fill me-1"></i>SoloCRM</div>
    <p class="text-muted mt-1">Sign in to your account</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" name="email" required autofocus placeholder="jane@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" name="remember" id="remember">
          <label class="form-check-label text-muted small" for="remember">Keep me signed in</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
      </form>
    </div>
  </div>

  <p class="text-center text-muted mt-3 small">
    Don't have an account? <a href="{{ url_for('signup') }}">Sign up free</a>
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
